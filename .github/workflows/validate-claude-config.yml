name: Validate Claude Code configuration

on:
  push:
    paths: ['.claude/**', 'decisions/**', 'scripts/**', 'CLAUDE.md', '.github/workflows/validate-claude-config.yml']
  pull_request:
    paths: ['.claude/**', 'decisions/**', 'scripts/**', 'CLAUDE.md']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: settings.json is valid JSON and uses real Claude Code keys
        run: |
          python3 - <<'PY'
          import json, sys
          s = json.load(open(".claude/settings.json"))
          # Keys that earlier versions of this template invented. Claude Code ignores them silently.
          invented = {"tools", "models", "git_hooks", "max_context_tokens", "toolPermissions",
                      "modelSelection", "codeCompletion", "testing", "documentation"}
          bad = sorted(invented & s.keys())
          if bad:
              sys.exit(f"settings.json uses keys Claude Code does not read: {bad}")
          print("settings.json ok")
          PY

      - name: agents and skills have required frontmatter
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          errors = []
          for f in pathlib.Path(".claude/agents").glob("*.md"):
              fm = re.match(r"^---\n(.*?)\n---", f.read_text(), re.S)
              if not fm or not re.search(r"^name:", fm.group(1), re.M) or not re.search(r"^description:", fm.group(1), re.M):
                  errors.append(f"{f}: needs name and description frontmatter")
          for f in pathlib.Path(".claude/skills").glob("*/SKILL.md"):
              fm = re.match(r"^---\n(.*?)\n---", f.read_text(), re.S)
              if not fm or not re.search(r"^description:", fm.group(1), re.M):
                  errors.append(f"{f}: needs description frontmatter")
          if errors:
              sys.exit("\n".join(errors))
          print("frontmatter ok")
          PY

      - name: hook scripts compile, are executable, and pass self-tests
        run: |
          python3 -m py_compile .claude/hooks/*.py scripts/*.py
          test -x scripts/git-hooks/pre-commit
          python3 scripts/test_hooks.py
